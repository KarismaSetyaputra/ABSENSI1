<!DOCTYPE html>
<!-- =========================================================================
     dashboard_admin.html  —  Konversi dari dashboard_admin.php
     ====================================================================== -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Admin - Absensi</title>
    <link rel="stylesheet" type="text/css" href="style.css?v=3">
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-logout-top {
            background: var(--danger-bg, #C1443B);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            width: auto;
            display: inline-block;
        }
        .summary-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 130px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .card .num {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-heading);
        }
        .card .label {
            font-size: 0.82rem;
            color: var(--text-muted, #6D7D77);
            margin-top: 4px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-hadir { background: var(--success-tint); color: var(--accent-cyan); border: 1px solid var(--success-border); }
        .badge-izin  { background: var(--warning-tint); color: var(--accent-gold); border: 1px solid var(--warning-border); }
        .badge-sakit { background: var(--danger-tint); color: #F17A6E; border: 1px solid var(--danger-border); }
        .badge-belum {
            background: var(--neutral-tint);
            color: var(--text-muted);
            border: 1px solid var(--neutral-border);
        }
        h3.section-title {
            margin: 30px 0 10px 0;
            color: var(--text-heading);
        }
        .keterangan-cell {
            font-size: 0.85rem;
            color: var(--text-muted, #6D7D77);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Dashboard Admin - Absensi</h2>
        <a href="logout.html" class="btn-logout-top">Logout</a>
    </div>

    <div class="summary-cards">
        <div class="card">
            <div class="num" id="total-siswa">0</div>
            <div class="label">Total Murid</div>
        </div>
        <div class="card">
            <div class="num" id="total-hadir">0</div>
            <div class="label">Hadir Hari Ini</div>
        </div>
        <div class="card">
            <div class="num" id="total-izin">0</div>
            <div class="label">Izin Hari Ini</div>
        </div>
        <div class="card">
            <div class="num" id="total-sakit">0</div>
            <div class="label">Sakit Hari Ini</div>
        </div>
        <div class="card">
            <div class="num" id="belum-isi">0</div>
            <div class="label">Belum Mengisi</div>
        </div>
    </div>

    <h3 class="section-title">Status Kehadiran Hari Ini (<span id="tanggal-hari-ini"></span>)</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                    <th>Status</th>
                    <th>Keterangan / Foto</th>
                </tr>
            </thead>
            <tbody id="tabel-status-hari-ini"></tbody>
        </table>
    </div>

    <h3 class="section-title">Riwayat Absensi Terbaru</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama</th>
                    <th>Status</th>
                    <th>Tanggal</th>
                    <th>Waktu</th>
                    <th>Keterangan / Foto</th>
                </tr>
            </thead>
            <tbody id="tabel-riwayat"></tbody>
        </table>
    </div>
</div>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<script src="koneksi.js"></script>
<script src="app.js"></script>
<script>
(function () {
    'use strict';

    /* if (!isset($_SESSION['login']) || $_SESSION['role'] !== 'admin') */
    const session = Guard.require('admin');
    if (!session) {
        return;
    }

    const hariIni = App.tanggalHariIni();

    const semuaSiswa = Koneksi.all('siswa').slice().sort(function (a, b) {
        return String(a.nama).localeCompare(String(b.nama), 'id');
    });

    const semuaAbsensi = Koneksi.all('absensi');
    const absensiHariIni = semuaAbsensi.filter(function (a) {
        return a.tanggal_absensi === hariIni;
    });

    /* ------------------------------ Ringkasan ------------------------------ */
    const totalSiswa = Koneksi.count('siswa');
    const totalHadir = absensiHariIni.filter(function (a) { return a.status === 'Hadir'; }).length;
    const totalIzin = absensiHariIni.filter(function (a) { return a.status === 'Izin'; }).length;
    const totalSakit = absensiHariIni.filter(function (a) { return a.status === 'Sakit'; }).length;
    const sudahIsi = totalHadir + totalIzin + totalSakit;
    const belumIsi = totalSiswa - sudahIsi;

    document.getElementById('total-siswa').textContent = totalSiswa;
    document.getElementById('total-hadir').textContent = totalHadir;
    document.getElementById('total-izin').textContent = totalIzin;
    document.getElementById('total-sakit').textContent = totalSakit;
    document.getElementById('belum-isi').textContent = belumIsi;
    document.getElementById('tanggal-hari-ini').textContent = App.tampilTanggal(hariIni);

    /* ------------- Status kehadiran semua siswa hari ini (LEFT JOIN) ------ */
    function renderStatusHariIni() {
        const tbody = document.getElementById('tabel-status-hari-ini');

        if (semuaSiswa.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Belum ada data murid.</td></tr>';
            return;
        }

        tbody.innerHTML = semuaSiswa.map(function (siswa, index) {
            const absensi = absensiHariIni.filter(function (a) {
                return String(a.id_siswa) === String(siswa.id_siswa);
            })[0];

            let selStatus;
            if (absensi) {
                selStatus = '<span class="badge ' + App.badgeKelas(absensi.status) + '">' +
                    App.escapeHtml(absensi.status) + ' - ' +
                    App.escapeHtml(App.tampilJam(absensi.waktu_absensi)) +
                    '</span>';
            } else {
                selStatus = '<span class="badge badge-belum">Belum Mengisi</span>';
            }

            const keterangan = absensi
                ? '<span class="keterangan-cell">' + App.keteranganFoto(absensi, 'Lihat Foto') + '</span>'
                : '<span class="keterangan-cell">-</span>';

            return '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td>' + App.escapeHtml(siswa.nis) + '</td>' +
                '<td>' + App.escapeHtml(siswa.nama) + '</td>' +
                '<td>' + App.escapeHtml(siswa.jurusan) + '</td>' +
                '<td>' + selStatus + '</td>' +
                '<td>' + keterangan + '</td>' +
                '</tr>';
        }).join('');
    }

    /* ---------------- Riwayat absensi lengkap (50 terbaru) ---------------- */
    function renderRiwayat() {
        const tbody = document.getElementById('tabel-riwayat');

        const riwayat = semuaAbsensi.slice()
            .sort(function (a, b) {
                return Absensi.kunciUrut(b).localeCompare(Absensi.kunciUrut(a));
            })
            .slice(0, 50);

        if (riwayat.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-row">Belum ada riwayat absensi.</td></tr>';
            return;
        }

        tbody.innerHTML = riwayat.map(function (r, index) {
            const siswa = Koneksi.findOne('siswa', function (s) {
                return String(s.id_siswa) === String(r.id_siswa);
            });

            const nis = siswa ? siswa.nis : '-';
            const nama = siswa ? siswa.nama : '(data murid tidak ditemukan)';

            return '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td>' + App.escapeHtml(nis) + '</td>' +
                '<td>' + App.escapeHtml(nama) + '</td>' +
                '<td><span class="badge ' + App.badgeKelas(r.status) + '">' + App.escapeHtml(r.status) + '</span></td>' +
                '<td>' + App.escapeHtml(App.tampilTanggal(r.tanggal_absensi)) + '</td>' +
                '<td>' + App.escapeHtml(App.tampilJam(r.waktu_absensi)) + '</td>' +
                '<td><span class="keterangan-cell">' + App.keteranganFoto(r, 'Lihat Foto') + '</span></td>' +
                '</tr>';
        }).join('');
    }

    renderStatusHariIni();
    renderRiwayat();
})();
</script>

</body>
</html>
