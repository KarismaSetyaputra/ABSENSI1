<!DOCTYPE html>
<!-- =========================================================================
     dashboard_murid.html  —  Konversi dari dashboard_murid.php
     ====================================================================== -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Murid - Absensi</title>
    <link rel="stylesheet" type="text/css" href="style.css?v=3">
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-logout-top {
            background: var(--danger-bg, #C1443B);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            width: auto;
            display: inline-block;
        }
        .absen-box {
            background: var(--glass-bg, #FFFFFF);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .absen-status {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--text-color);
            text-align: center;
        }
        .btn-absen {
            background: var(--button-bg);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: auto;
        }
        .btn-absen:disabled {
            background: #DCE4DF;
            color: var(--text-muted, #6D7D77);
            cursor: not-allowed;
        }
        .alert-msg {
            background: var(--warning-tint);
            border: 1px solid var(--warning-border);
            color: var(--accent-gold);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .action-links a {
            font-size: 0.9rem;
            margin: 0 4px;
        }

        /* Status pilihan (Hadir / Izin / Sakit) */
        .status-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }
        .status-switch label {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid var(--glass-border, #DCE4DF);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted, #6D7D77);
            background: var(--neutral-tint, rgba(255,255,255,0.06));
            transition: all 0.2s ease;
        }
        .status-switch input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        .status-switch input[type="radio"]:focus-visible + span {
            text-decoration: underline;
        }
        .status-switch label.active-hadir {
            background: var(--success-tint);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .status-switch label.active-izin {
            background: var(--warning-tint);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .status-switch label.active-sakit {
            background: var(--danger-tint);
            border-color: #E2564A;
            color: #F17A6E;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            background: var(--input-bg, rgba(0,0,0,0.25));
            color: var(--text-color);
            border: 1px dashed var(--glass-border);
            border-radius: 8px;
        }
        .field-hint {
            font-size: 0.8rem;
            color: var(--text-muted, #6D7D77);
            margin-bottom: 15px;
        }

        /* Badge status di tabel riwayat */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-hadir { background: var(--success-tint); color: var(--accent-cyan); border: 1px solid var(--success-border); }
        .badge-izin  { background: var(--warning-tint); color: var(--accent-gold); border: 1px solid var(--warning-border); }
        .badge-sakit { background: var(--danger-tint); color: #F17A6E; border: 1px solid var(--danger-border); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Halo, <span id="nama-murid"></span></h2>
        <a href="logout.html" class="btn-logout-top">Logout</a>
    </div>

    <div class="alert-msg" id="alert-msg" hidden></div>

    <div class="absen-box">

        <!-- Kondisi: murid sudah mengisi absensi hari ini -->
        <div id="sudah-absen" hidden>
            <p class="absen-status">
                &#9989; Kamu sudah mengisi absensi hari ini:
                <span class="badge" id="badge-hari-ini"></span>
                jam <strong id="jam-hari-ini"></strong>
            </p>
            <div style="text-align:center;">
                <button class="btn-absen" type="button" disabled>Sudah Diisi Hari Ini</button>
            </div>
        </div>

        <!-- Kondisi: murid belum mengisi absensi hari ini -->
        <div id="belum-absen" hidden>
            <p class="absen-status">Kamu belum mengisi absensi hari ini (<span id="tanggal-hari-ini"></span>)</p>

            <form action="dashboard_murid.html" method="POST" enctype="multipart/form-data" id="form-absen">
                <div class="status-switch">
                    <label id="label-hadir">
                        <input type="radio" name="status" value="Hadir" checked>
                        <span>Hadir</span>
                    </label>
                    <label id="label-izin">
                        <input type="radio" name="status" value="Izin">
                        <span>Izin</span>
                    </label>
                    <label id="label-sakit">
                        <input type="radio" name="status" value="Sakit">
                        <span>Sakit</span>
                    </label>
                </div>

                <div id="field-foto">
                    <label for="input-foto">Foto Bukti (harus di area sekolah)</label>
                    <input type="file" name="foto" id="input-foto" accept="image/*" capture="environment">
                    <p class="field-hint">Wajib diupload sebagai bukti kamu absen langsung di sekolah. Format JPG/PNG, maks 3MB.</p>
                </div>

                <div id="field-keterangan" style="display:none;">
                    <label for="input-keterangan">Keterangan</label>
                    <textarea name="keterangan" id="input-keterangan" placeholder="Tulis alasan izin/sakit kamu"></textarea>
                </div>

                <button type="submit" name="kirim_absen" class="btn-absen" style="width:100%;">Kirim Absensi</button>
            </form>
        </div>

    </div>

    <h3 class="section-title" style="margin-bottom:10px; color:var(--text-heading);">Riwayat Absensi Kamu</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Waktu</th>
                    <th>Status</th>
                    <th>Foto</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabel-riwayat"></tbody>
        </table>
    </div>
</div>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<script src="koneksi.js"></script>
<script src="app.js"></script>
<script>
(function () {
    'use strict';

    /* if (!isset($_SESSION['login']) || $_SESSION['role'] !== 'murid') */
    const session = Guard.require('murid');
    if (!session) {
        return;
    }

    const elNama = document.getElementById('nama-murid');
    const elAlert = document.getElementById('alert-msg');
    const elTanggal = document.getElementById('tanggal-hari-ini');
    const boxSudah = document.getElementById('sudah-absen');
    const boxBelum = document.getElementById('belum-absen');
    const tbodyRiwayat = document.getElementById('tabel-riwayat');

    elNama.textContent = session.nama;

    /* $msg = isset($_GET['msg']) ? $_GET['msg'] : ''; */
    const msg = App.param('msg');
    if (msg) {
        elAlert.textContent = msg;
        elAlert.hidden = false;
    }

    const hariIni = App.tanggalHariIni();

    /* Cek apakah sudah mengisi absensi hari ini */
    const absenHariIni = Absensi.absenHariIni(session.id_siswa, hariIni);

    if (absenHariIni) {
        const badge = document.getElementById('badge-hari-ini');
        badge.textContent = absenHariIni.status;
        badge.classList.add(App.badgeKelas(absenHariIni.status));
        document.getElementById('jam-hari-ini').textContent = App.tampilJam(absenHariIni.waktu_absensi);
        boxSudah.hidden = false;
    } else {
        elTanggal.textContent = App.tampilTanggal(hariIni);
        boxBelum.hidden = false;
        siapkanFormAbsen();
    }

    /* ----------------------------------------------------------------- *
     * Form absensi (absen.php)
     * ----------------------------------------------------------------- */
    function siapkanFormAbsen() {
        const form = document.getElementById('form-absen');
        const inputFoto = document.getElementById('input-foto');
        const inputKeterangan = document.getElementById('input-keterangan');

        function updateStatus() {
            const status = document.querySelector('input[name="status"]:checked').value;

            document.getElementById('label-hadir').classList.toggle('active-hadir', status === 'Hadir');
            document.getElementById('label-izin').classList.toggle('active-izin', status === 'Izin');
            document.getElementById('label-sakit').classList.toggle('active-sakit', status === 'Sakit');

            const isHadir = status === 'Hadir';
            document.getElementById('field-foto').style.display = isHadir ? 'block' : 'none';
            document.getElementById('field-keterangan').style.display = isHadir ? 'none' : 'block';

            inputFoto.required = isHadir;
            inputKeterangan.required = !isHadir;
        }

        document.querySelectorAll('input[name="status"]').forEach(function (radio) {
            radio.addEventListener('change', updateStatus);
        });
        updateStatus();

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const status = document.querySelector('input[name="status"]:checked').value;
            const tombol = form.querySelector('button[type="submit"]');
            const teksAsli = tombol.textContent;

            tombol.disabled = true;
            tombol.textContent = 'Menyimpan...';

            Absensi.submit(session.id_siswa, {
                status: status,
                keterangan: inputKeterangan.value,
                foto: inputFoto.files.length > 0 ? inputFoto.files[0] : null
            }).then(function (hasil) {
                if (hasil.ok) {
                    App.redirect('dashboard_murid.html?msg=' + encodeURIComponent(hasil.msg));
                    return;
                }

                tombol.disabled = false;
                tombol.textContent = teksAsli;
                elAlert.textContent = hasil.msg;
                elAlert.hidden = false;
                elAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });
    }

    /* ----------------------------------------------------------------- *
     * Riwayat absensi murid ini
     * ----------------------------------------------------------------- */
    function renderRiwayat() {
        const riwayat = Absensi.riwayatMurid(session.id_siswa);

        if (riwayat.length === 0) {
            tbodyRiwayat.innerHTML = '<tr><td colspan="6" class="empty-row">Belum ada riwayat absensi.</td></tr>';
            return;
        }

        tbodyRiwayat.innerHTML = riwayat.map(function (r, index) {
            const badgeKelas = App.badgeKelas(r.status);
            const foto = r.foto
                ? '<a href="#" data-foto="' + App.escapeHtml(r.foto) + '">Lihat</a>'
                : '-';

            return '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td>' + App.escapeHtml(App.tampilTanggal(r.tanggal_absensi)) + '</td>' +
                '<td>' + App.escapeHtml(App.tampilJam(r.waktu_absensi)) + '</td>' +
                '<td><span class="badge ' + badgeKelas + '">' + App.escapeHtml(r.status) + '</span></td>' +
                '<td>' + foto + '</td>' +
                '<td class="action-links">' +
                    '<a href="edit.html?id=' + encodeURIComponent(r.id_absensi) + '">Edit</a> | ' +
                    '<a href="hapus.html?id=' + encodeURIComponent(r.id_absensi) + '">Hapus</a>' +
                '</td>' +
                '</tr>';
        }).join('');
    }

    renderRiwayat();
})();
</script>

</body>
</html>
